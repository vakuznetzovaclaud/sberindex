<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="100%" role="img" aria-label="Архитектура: данные и тексты, прогноз, обнаружение, события из текстов, система тревог" font-family="'Nunito Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#121212"/></marker>
  </defs>
  <style>
    .a-bx{fill:#fff;stroke:#121212;stroke-width:1.2}
    .a-hd{font-size:14px;font-weight:900;letter-spacing:.06em}
    .a-ln{font-size:13px;fill:#121212}
    .a-lb{font-size:12px;fill:#555}
    .a-ar{stroke:#121212;stroke-width:1.6;fill:none}
    .a-dl{stroke:#121212;stroke-width:1.4;fill:none;stroke-dasharray:6 5}
  </style>

  <!-- данные о тратах -->
  <rect class="a-bx" x="0" y="0" width="240" height="240"/>
  <rect x="0" y="0" width="240" height="36" fill="#121212"/>
  <text class="a-hd" x="14" y="24" fill="#fff">ДАННЫЕ О ТРАТАХ</text>
  <text class="a-ln" x="14" y="62">СберИндекс: 2 016 МО,</text>
  <text class="a-ln" x="14" y="83">24 месяца, 6 категорий трат</text>
  <text class="a-ln" x="14" y="112">Национальные ряды: месячные</text>
  <text class="a-ln" x="14" y="133">с 2018 г., недельные</text>
  <text class="a-ln" x="14" y="154">по 46 категориям</text>
  <text class="a-ln" x="14" y="183">Росстат: население, ОКТМО</text>

  <!-- тексты -->
  <rect class="a-bx" x="0" y="330" width="240" height="240"/>
  <rect x="0" y="330" width="240" height="36" fill="#121212"/>
  <text class="a-hd" x="14" y="354" fill="#fff">ТЕКСТЫ</text>
  <text class="a-ln" x="14" y="392">652 акта о ЧС, в анализе 378</text>
  <text class="a-ln" x="14" y="413">(портал опубликования, API)</text>
  <text class="a-ln" x="14" y="442">87 тыс. новостей МЧС,</text>
  <text class="a-ln" x="14" y="463">69 регионов</text>
  <text class="a-ln" x="14" y="492">Telegram: 181 официальный канал —</text>
  <text class="a-ln" x="14" y="513">паводок и события 2024 года</text>

  <!-- прогноз -->
  <rect class="a-bx" x="333" y="0" width="240" height="240"/>
  <rect x="333" y="0" width="240" height="36" fill="#7F9FFF"/>
  <text class="a-hd" x="347" y="24" fill="#121212">ПРОГНОЗ</text>
  <text class="a-ln" x="347" y="62">Общий фактор месяца</text>
  <text class="a-ln" x="347" y="83">+ отклонение МО</text>
  <text class="a-ln" x="347" y="112">LightGBM: поправка</text>
  <text class="a-ln" x="347" y="141">TimesFM-2.5, TiRex-2,</text>
  <text class="a-ln" x="347" y="162">Chronos-2 — на входе</text>
  <text class="a-ln" x="347" y="183">без сезонности</text>
  <text class="a-ln" x="347" y="212">Ансамбль + интервалы</text>

  <!-- текст → события -->
  <rect class="a-bx" x="333" y="330" width="240" height="240"/>
  <rect x="333" y="330" width="240" height="36" fill="#FFE762"/>
  <text class="a-hd" x="347" y="354" fill="#121212">ТЕКСТ → СОБЫТИЯ</text>
  <text class="a-ln" x="347" y="392">OCR → GigaChat3.1</text>
  <text class="a-ln" x="347" y="413">копирует факты по схеме</text>
  <text class="a-ln" x="347" y="442">Категорию ставят правила</text>
  <text class="a-ln" x="347" y="471">Привязка к МО: справочник</text>
  <text class="a-ln" x="347" y="492">СберИндекса и ОКТМО</text>
  <text class="a-ln" x="347" y="521">Новости: 4 вопроса «да/нет»</text>
  <text class="a-ln" x="347" y="550">У события — дата публикации</text>

  <!-- обнаружение -->
  <rect class="a-bx" x="666" y="0" width="240" height="240"/>
  <rect x="666" y="0" width="240" height="36" fill="#F46DE4"/>
  <text class="a-hd" x="680" y="24" fill="#121212">ОБНАРУЖЕНИЕ</text>
  <text class="a-ln" x="680" y="62">Остатки прогноза → z</text>
  <text class="a-ln" x="680" y="83">в единицах шума МО, минус</text>
  <text class="a-ln" x="680" y="104">общая ошибка месяца</text>
  <text class="a-ln" x="680" y="133">11 детекторов → сумма категорий</text>
  <text class="a-ln" x="680" y="162">Проверка: полусинтетика,</text>
  <text class="a-ln" x="680" y="183">паводок, PELT,</text>
  <text class="a-ln" x="680" y="204">недельные ряды</text>

  <!-- система тревог -->
  <rect class="a-bx" x="1000" y="0" width="240" height="570"/>
  <rect x="1000" y="0" width="240" height="36" fill="#41E786"/>
  <text class="a-hd" x="1014" y="24" fill="#121212">СИСТЕМА ТРЕВОГ</text>
  <text class="a-ln" x="1014" y="62">Тревоги по текстам —</text>
  <text class="a-ln" x="1014" y="83">в день публикации;</text>
  <text class="a-ln" x="1014" y="104">сливаются в эпизоды</text>
  <text class="a-ln" x="1014" y="133">Сверка с провалами трат:</text>
  <text class="a-ln" x="1014" y="154">эталон — только по тратам,</text>
  <text class="a-ln" x="1014" y="175">плацебо-даты, по источникам</text>
  <text class="a-ln" x="1014" y="204">Тревоги по тратам —</text>
  <text class="a-ln" x="1014" y="225">после конца месяца</text>
  <text class="a-hd" x="1014" y="392" fill="#121212">НА ВЫХОДЕ</text>
  <text class="a-ln" x="1014" y="421">Прогноз на 1–3 месяца</text>
  <text class="a-ln" x="1014" y="442">с интервалами</text>
  <text class="a-ln" x="1014" y="471">Список МО для проверки —</text>
  <text class="a-ln" x="1014" y="492">до выхода трат за месяц</text>
  <text class="a-ln" x="1014" y="521">Лента, карта, разборы</text>

  <!-- потоки -->
  <line class="a-ar" x1="240" y1="120" x2="331" y2="120" marker-end="url(#ah)"/>
  <text class="a-lb" x="286" y="110" text-anchor="middle">траты</text>
  <line class="a-ar" x1="573" y1="120" x2="664" y2="120" marker-end="url(#ah)"/>
  <text class="a-lb" x="619" y="110" text-anchor="middle">остатки</text>
  <line class="a-ar" x1="906" y1="120" x2="998" y2="120" marker-end="url(#ah)"/>
  <text class="a-lb" x="953" y="110" text-anchor="middle">тревоги</text>
  <line class="a-ar" x1="240" y1="450" x2="331" y2="450" marker-end="url(#ah)"/>
  <text class="a-lb" x="286" y="440" text-anchor="middle">тексты</text>
  <line class="a-ar" x1="573" y1="450" x2="998" y2="450" marker-end="url(#ah)"/>
  <text class="a-lb" x="786" y="440" text-anchor="middle">тревоги по текстам</text>
  <line class="a-dl" x1="400" y1="330" x2="400" y2="243" marker-end="url(#ah)"/>
  <text class="a-lb" x="410" y="283">признаки,</text>
  <text class="a-lb" x="410" y="298">оценка месяца</text>
  <line class="a-dl" x1="540" y1="330" x2="698" y2="242" marker-end="url(#ah)"/>
  <text class="a-lb" x="650" y="301">подсказка детектору,</text>
  <text class="a-lb" x="650" y="316">группа МО из текста</text>

  <!-- дата знания -->
  <rect x="0" y="600" width="1240" height="52" fill="none" stroke="#121212" stroke-width="1.2"/>
  <text class="a-ln" x="20" y="631"><tspan font-weight="900">Дата знания у каждого факта.</tspan> В точке прогноза T0 модели видят только опубликованное до T0; тест портит всё после T0 и проверяет, что прогноз не изменился.</text>
</svg>
